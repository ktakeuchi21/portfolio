<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kai Takeuchi social preview artwork</title>
    <style>
      @font-face { font-family: Inter; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: Newsreader; font-weight: 200 800; src: url('../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-standard-normal.woff2') format('woff2'); }
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; padding: 62px 80px 54px; background: #faf9f6; color: #27332e; font-family: Inter, sans-serif; display: flex; flex-direction: column; border-right: 16px solid #3b594c; }
      header { display: flex; align-items: center; justify-content: space-between; color: #3b594c; }
      .mark { font: 500 52px/1 Newsreader, serif; letter-spacing: -5px; }
      .eyebrow { font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
      main { margin: auto 0; }
      h1 { font: 400 104px/1.05 Newsreader, serif; letter-spacing: -4px; margin: 0 0 22px; }
      p { font-size: 33px; line-height: 1.3; color: #3b594c; margin: 0; }
      footer { border-top: 1px solid #d7dcd4; padding-top: 24px; display: flex; align-items: center; justify-content: space-between; color: #60675f; font-size: 17px; }
      .topics { display: flex; align-items: center; gap: 20px; }
      .topics span + span::before { content: '/'; margin-right: 20px; color: #939d92; }
    </style>
  </head>
  <body>
    <header><span class="mark">kt.</span><span class="eyebrow">Product strategy &amp; development</span></header>
    <main><h1>Kai Takeuchi</h1><p>Healthcare + AI Product Leader</p></main>
    <footer><div class="topics"><span>Healthcare workflows</span><span>0-to-1 products</span><span>Applied AI</span></div><span>kaitakeuchi.com</span></footer>
  </body>
</html>
