<!doctype html>
<html lang="en">
  <head>

    <title>Kai Takeuchi social preview artwork</title>
    <style>

      h1 { margin: 0; font-size: 85px; font-weight: 570; line-height: .99; letter-spacing: -.065em; }
      h1 span { display: block; }
      p { margin: 0 0 26px; color: #e8d9b9; font-size: 40px; font-weight: 530; letter-spacing: -.035em; }
    </style>
  </head>
  <body>
    <main>
      <p>Kai Takeuchi</p>
