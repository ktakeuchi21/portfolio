<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
  <title id="title">Table for One: from an order to a pickup time</title>
  <desc id="description">A six-step workflow. Speak, type, or choose a saved order. OpenAI structures a draft for owner review. Twilio connects the phone call with OpenAI Realtime on an AWS voice worker. A human or restaurant voice AI confirms the order. Payment is at pickup or handled privately by the owner, who can also join when help is needed. The app reports the total, ready time, and outcome. This is a process illustration, not an n8n implementation. Calling remains disabled; automatic real-card payment is not implemented.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d7ddd6"/></pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="m3 2 5 4-5 4" fill="none" stroke="#4e6c5d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#283d31" flood-opacity=".06"/></filter>
    <style>
      .label { font: 700 23px Arial, Helvetica, sans-serif; letter-spacing: 1.6px; }
      .name { font: 600 47px Arial, Helvetica, sans-serif; fill: #24382e; }
      .detail { font: 400 27px Arial, Helvetica, sans-serif; fill: #4f6256; }
      .wire { fill: none; stroke: #4e6c5d; stroke-width: 3; marker-end: url(#arrow); }
      .port { fill: #fafbf8; stroke: #4e6c5d; stroke-width: 3; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1200" height="960" rx="18" fill="#f7f8f4"/>
  <rect x="24" y="154" width="1152" height="688" rx="14" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="58" font-size="23" font-weight="700" letter-spacing="3" fill="#3b594c">TABLE FOR ONE</text>
    <text x="56" y="123" font-family="Georgia, serif" font-size="54" fill="#24382e">Your order. One handoff.</text>
    <rect x="840" y="36" width="304" height="40" rx="20" fill="#e9eee5"/>
    <text x="992" y="63" text-anchor="middle" font-size="21" font-weight="700" letter-spacing="1" fill="#3b594c">PRIVATE TAKEOUT APP</text>
  </g>

  <!-- The path winds across each row. Ports and arrows preserve the reading order. -->
  <g class="wire">
    <path d="M540 272H650"/>
    <path d="M902 360V402"/>
    <path d="M660 500H550"/>
    <path d="M298 588V630"/>
    <path d="M540 728H650"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="184" width="484" height="176" rx="16" fill="#fff" stroke="#c9d4c9" stroke-width="2"/>
    <rect x="660" y="184" width="484" height="176" rx="16" fill="#fff" stroke="#c9d4c9" stroke-width="2"/>
    <rect x="660" y="412" width="484" height="176" rx="16" fill="#fff" stroke="#dcbeb7" stroke-width="2"/>
    <rect x="56" y="412" width="484" height="176" rx="16" fill="#fff" stroke="#c9d4c9" stroke-width="2"/>
    <rect x="56" y="640" width="484" height="176" rx="16" fill="#fff7e8" stroke="#bd9253" stroke-width="2"/>
    <rect x="660" y="640" width="484" height="176" rx="16" fill="#e9f0e7" stroke="#9db59e" stroke-width="2"/>
  </g>

  <g class="port">
    <circle cx="540" cy="272" r="7"/><circle cx="660" cy="272" r="7"/>
    <circle cx="902" cy="360" r="7"/><circle cx="902" cy="412" r="7"/>
    <circle cx="660" cy="500" r="7"/><circle cx="540" cy="500" r="7"/>
    <circle cx="298" cy="588" r="7"/><circle cx="298" cy="640" r="7"/>
    <circle cx="540" cy="728" r="7"/><circle cx="660" cy="728" r="7"/>
  </g>

  <!-- Input -->
  <rect x="82" y="204" width="44" height="44" rx="11" fill="#e9eee5"/>
  <g class="icon" transform="translate(92 214)" color="#3b594c"><rect x="9" y="1" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v4M8 23h8"/></g>
  <text x="140" y="235" class="label" fill="#3b594c">01 · INPUTS</text>
  <text x="82" y="296" class="name">Your order</text>
  <text x="82" y="336" class="detail">Voice · text · saved usual</text>

  <!-- Draft and explicit owner approval -->
  <rect x="686" y="204" width="44" height="44" rx="11" fill="#e9eee5"/>
  <g class="icon" transform="translate(696 214)" color="#3b594c"><rect x="4" y="2" width="16" height="21" rx="2"/><path d="m8 13 3 3 6-7M9 2v3h6V2"/></g>
  <text x="744" y="235" class="label" fill="#3b594c">02 · AI DRAFT + YOU</text>
  <text x="686" y="296" class="name">Review order</text>
  <text x="686" y="336" class="detail">Items · pickup · tip · limit</text>

  <!-- Telephony and the conversational model are distinct roles. -->
  <rect x="686" y="432" width="44" height="44" rx="11" fill="#f8e7e2"/>
  <g class="icon" transform="translate(696 442)" color="#a24330"><path d="m5 2 4 5-2 3a15 15 0 0 0 7 7l3-2 5 4c-1 4-4 5-8 3C7 19 2 14 1 7c0-3 1-4 4-5Z"/></g>
  <text x="744" y="463" class="label" fill="#a24330">03 · VOICE CALL</text>
  <text x="686" y="524" class="name">Twilio</text>
  <text x="686" y="564" class="detail">Audio ↔ OpenAI Realtime</text>

  <!-- Counterparty -->
  <rect x="82" y="432" width="44" height="44" rx="11" fill="#e9eee5"/>
  <g class="icon" transform="translate(92 442)" color="#3b594c"><path d="M3 10v12h18V10M1 10l3-8h16l3 8M1 10a4 4 0 0 0 7 2 4 4 0 0 0 8 0 4 4 0 0 0 7-2M9 22v-7h6v7"/></g>
  <text x="140" y="463" class="label" fill="#3b594c">04 · CONVERSATION</text>
  <text x="82" y="524" class="name">Restaurant</text>
  <text x="82" y="564" class="detail">Human or voice AI</text>

  <!-- Payment remains an owner decision, not autonomous card processing. -->
  <rect x="82" y="660" width="44" height="44" rx="11" fill="#f3e3c6"/>
  <g class="icon" transform="translate(92 670)" color="#805c27"><rect x="1" y="4" width="22" height="16" rx="3"/><path d="M1 9h22M5 16h4"/></g>
  <text x="140" y="691" class="label" fill="#805c27">05 · PAYMENT / HELP</text>
  <text x="82" y="752" class="name">You stay in control</text>
  <text x="82" y="792" class="detail">Pay at pickup or join privately</text>

  <!-- Persist only confirmed results; unpaid and uncertain states stay explicit. -->
  <rect x="686" y="660" width="44" height="44" rx="11" fill="#d6e5d4"/>
  <g class="icon" transform="translate(696 670)" color="#3b594c"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
  <text x="744" y="691" class="label" fill="#3b594c">06 · OUTCOME</text>
  <text x="686" y="752" class="name">Know what’s next</text>
  <text x="686" y="792" class="detail">Total · ready time · status</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M56 858H1144" stroke="#cdd7cb" stroke-width="2"/>
    <text x="56" y="896" font-size="26" font-weight="600" fill="#3b594c">AWS hosts the app, order records, and on-demand voice worker.</text>
    <text x="56" y="934" font-size="25" fill="#6b5734">Calling disabled · Real-card payment requires the owner</text>
  </g>
</svg>
